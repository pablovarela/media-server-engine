services:
  jellyfin:
    container_name: jellyfin
    ports:
      - "8096:8096"        # HTTP
      - "8920:8920"        # HTTPS
      - "7359:7359/udp"    # client auto-discovery (optional)
      - "1900:1900/udp"    # DLNA (optional)
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - UMASK=022
    volumes:
      - ${DATA_DIR}/volumes/jellyfin/config:/config
      - ${DATA_DIR}/media/tvshows:/data/tvshows
      - ${DATA_DIR}/media/movies:/data/movies
    restart: unless-stopped

  gluetun:
    container_name: gluetun
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    ports:
      # deluge
      - "8112:8112"
      - "58846:58846"
      - "58946:58946"
      - "6881:6881"
      - "6881:6881/udp"
      # Prowlarr
      - "9696:9696"
      # flaresolverr
      - "8198:8191"
    env_file:
      - .secrets/vpn.env

  sonarr:
    container_name: sonarr
    ports:
      - "8989:8989"
    env_file:
      - .secrets/sonarr.env
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - UMASK=022
    volumes:
      - ${DATA_DIR}/volumes/sonarr/data:/config
      - ${DATA_DIR}/media/tvshows:/tv
      - ${DATA_DIR}/downloads:/downloads
    depends_on:
      - prowlarr
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8989/ping"]
      interval: 30s
      timeout: 5s
      start_period: 2m
      retries: 5
    restart: unless-stopped

  radarr:
    container_name: radarr
    ports:
      - "7878:7878"
    env_file:
      - .secrets/radarr.env
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - UMASK=022
    volumes:
      - ${DATA_DIR}/volumes/radarr/config:/config
      - ${DATA_DIR}/media/movies:/movies
      - ${DATA_DIR}/downloads:/downloads
    depends_on:
      - prowlarr
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:7878/ping"]
      interval: 30s
      timeout: 5s
      start_period: 2m
      retries: 5
    restart: unless-stopped

  bazarr:
    container_name: bazarr
    ports:
      - "6767:6767"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - UMASK=022
    volumes:
      - ${DATA_DIR}/volumes/bazarr/config:/config
      - ${DATA_DIR}/media/movies:/movies
      - ${DATA_DIR}/media/tvshows:/tv
    restart: unless-stopped

  prowlarr:
    container_name: prowlarr
    env_file:
      - .secrets/prowlarr.env
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - UMASK=002
    volumes:
      - ${DATA_DIR}/volumes/prowlarr/data:/config
    network_mode: service:gluetun
    depends_on:
      - gluetun
      - flaresolverr
    restart: unless-stopped

  flaresolverr:
    container_name: flaresolverr
    network_mode: service:gluetun
    depends_on:
      - gluetun
    restart: unless-stopped

  deluge:
    container_name: deluge
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - UMASK=022
      - DELUGE_LOGLEVEL=error
    volumes:
      - ${DATA_DIR}/volumes/deluge/config:/config
      - ${DATA_DIR}/downloads:/downloads
    network_mode: service:gluetun
    depends_on:
        - gluetun
    restart: unless-stopped

  portainer:
    container_name: portainer
    user: "1000:1000"
    command: --admin-password-file /run/secrets/portainer_admin
    group_add:
      - "${DOCKER_GID:?DOCKER_GID is written to .env by make update}"
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DATA_DIR}/volumes/portainer/data:/data
      - ./.secrets/portainer_admin:/run/secrets/portainer_admin:ro
    restart: unless-stopped

  configarr:
    container_name: configarr
    user: "1000:1000"
    restart: "no"
    depends_on:
      sonarr:
        condition: service_healthy
      radarr:
        condition: service_healthy
    environment:
      - SECRETS_LOCATION=/app/secrets/secrets.yml
    volumes:
      - ${CONFIG_DIR}/configarr:/app/config:ro
      - ./.secrets/configarr:/app/secrets:ro
      - ${DATA_DIR}/volumes/configarr/repos:/app/repos

  seerr:
    container_name: seerr
    user: "1000:1000"
    ports:
      - "5055:5055"
    environment:
      - TZ=Etc/UTC
    volumes:
      - ${DATA_DIR}/volumes/seerr/config:/app/config
    restart: unless-stopped

  maintainerr:
    container_name: maintainerr
    user: "1000:1000"
    ports:
      - "6246:6246"
    environment:
      - TZ=Etc/UTC
    volumes:
      - ${DATA_DIR}/volumes/maintainerr/data:/opt/data
    restart: unless-stopped
