- Healthchecks:
    - Backup:
        id: healthchecks-backup
        href: https://healthchecks.io/
        widget:
          type: customapi
          url: https://healthchecks.io/api/v3/checks/?slug=@HEALTHCHECK_BACKUP@
          headers:
            X-Api-Key: "{{HOMEPAGE_VAR_HEALTHCHECKS_KEY}}"
          refreshInterval: 60000
          mappings:
            - field: checks.0.status
              label: Backup
              remap:
                - value: up
                  to: "🟢 Up"
                - value: grace
                  to: "🟠 Late"
                - value: down
                  to: "🔴 Down"
    - Update:
        id: healthchecks-update
        href: https://healthchecks.io/
        widget:
          type: customapi
          url: https://healthchecks.io/api/v3/checks/?slug=@HEALTHCHECK_UPDATE@
          headers:
            X-Api-Key: "{{HOMEPAGE_VAR_HEALTHCHECKS_KEY}}"
          refreshInterval: 60000
          mappings:
            - field: checks.0.status
              label: Update
              remap:
                - value: up
                  to: "🟢 Up"
                - value: grace
                  to: "🟠 Late"
                - value: down
                  to: "🔴 Down"
    - Verify:
        id: healthchecks-verify
        href: https://healthchecks.io/
        widget:
          type: customapi
          url: https://healthchecks.io/api/v3/checks/?slug=@HEALTHCHECK_VERIFY@
          headers:
            X-Api-Key: "{{HOMEPAGE_VAR_HEALTHCHECKS_KEY}}"
          refreshInterval: 60000
          mappings:
            - field: checks.0.status
              label: Verify
              remap:
                - value: up
                  to: "🟢 Up"
                - value: grace
                  to: "🟠 Late"
                - value: down
                  to: "🔴 Down"
- Coming up:
    - Next up:
        icon: mdi-calendar-clock
        widget:
          type: calendar
          view: agenda
          maxEvents: 8
          integrations:
            - type: sonarr
              service_group: Library
              service_name: Sonarr
            - type: radarr
              service_group: Library
              service_name: Radarr
    - Calendar:
        icon: mdi-calendar-month
        widget:
          type: calendar
          view: monthly
          integrations:
            - type: sonarr
              service_group: Library
              service_name: Sonarr
            - type: radarr
              service_group: Library
              service_name: Radarr
- Watch:
    - Recently added:
        href: http://@HOST@:8096
        icon: jellyfin.png
        widget:
          type: customapi
          url: http://jellyfin:8096/Items?SortBy=DateCreated&SortOrder=Descending&IncludeItemTypes=Movie,Episode&Recursive=true&Limit=5
          headers:
            Authorization: 'MediaBrowser Token="{{HOMEPAGE_VAR_JELLYFIN_KEY}}"'
          display: dynamic-list
          mappings:
            items: Items
            name: Name
            label: SeriesName
            limit: 5
    - Jellyfin:
        href: http://@HOST@:8096
        icon: jellyfin.png
        siteMonitor: http://jellyfin:8096
        widget:
          type: jellyfin
          url: http://jellyfin:8096
          key: "{{HOMEPAGE_VAR_JELLYFIN_KEY}}"
          version: 2
          enableBlocks: true
          enableNowPlaying: true
    - Seerr:
        href: http://@HOST@:5055
        icon: seerr.png
        siteMonitor: http://seerr:5055
        widget:
          type: seerr
          url: http://seerr:5055
          key: "{{HOMEPAGE_VAR_SEERR_KEY}}"
