- Downloads:
    - VPN:
        icon: gluetun.png
        widget:
          type: gluetun
          url: http://gluetun:8000
          key: "{{HOMEPAGE_VAR_GLUETUN_KEY}}"
          version: 2
          fields: [ "public_ip", "region", "country" ]
    - Deluge:
        href: http://@HOST@:8112
        icon: deluge.png
        siteMonitor: http://gluetun:8112
        widget:
          type: deluge
          url: http://gluetun:8112
          password: "{{HOMEPAGE_VAR_DELUGE_PASSWORD}}"
