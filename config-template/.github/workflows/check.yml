name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install mse
        run: curl -fsSL https://github.com/pablovarela/media-server-engine/releases/latest/download/install.sh | sh
      - name: Check the config
        run: ~/.local/bin/mse check-config
