[project]
name = "media-server-engine"
version = "0"
requires-python = ">=3.9"

[dependency-groups]
test = [
    "pytest",
    "pytest-cov",
    "pyyaml",
]

[tool.uv]
package = false
default-groups = ["test"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["scripts", "scripts/wire", "tests"]
addopts = "--strict-markers --cov --cov-report=term-missing"

[tool.coverage.run]
branch = true
source_dirs = ["scripts", "scripts/engine", "scripts/wire"]

[tool.coverage.report]
exclude_also = ['if __name__ == "__main__":']
