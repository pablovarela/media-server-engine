name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: Install the test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bats python3-yaml parallel
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Run the tests
        id: tests
        run: |
          mkdir -p reports
          set +e
          make test-scripts BATS_FLAGS="--report-formatter junit --output reports"
          scripts=$?
          make test-python PYTEST_FLAGS="--junitxml=reports/pytest.xml" > reports/pytest-coverage.txt 2>&1
          python=$?
          cat reports/pytest-coverage.txt
          make go-test GO_TEST_FLAGS="--junitfile reports/go.xml"
          go=$?
          if [ -f coverage.out ]; then
            go tool cover -func=coverage.out | scripts/go-coverage-report.sh > reports/go-coverage.md
            cat reports/go-coverage.md >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "status=$((scripts || python || go))" >> "$GITHUB_OUTPUT"
      - name: Report the Python test coverage
        if: always()
        uses: MishaKav/pytest-coverage-comment@9ee59af31bd7bcada1cc496f086b407122602dbd # v1.12.3
        with:
          title: Python test coverage
          pytest-coverage-path: reports/pytest-coverage.txt
          junitxml-path: reports/pytest.xml
          hide-comment: ${{ github.event_name != 'pull_request' }}
      - name: Report the Go test coverage
        if: always() && github.event_name == 'pull_request' && hashFiles('reports/go-coverage.md') != ''
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: go-coverage
          path: reports/go-coverage.md
      - name: Report the test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0
        with:
          check_name: Test Results
          files: reports/*.xml
          check_run: false
          comment_mode: off
      - name: Fail when a test failed
        if: steps.tests.outputs.status != '0'
        run: exit 1

  python-3-9:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Run the Python tests on Python 3.9, as on Raspberry Pi OS bullseye
        run: make test-python PYTHON=3.9

  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: Read the golangci-lint version from tools/go.mod
        id: tools
        run: echo "golangci-lint=$(go list -modfile=tools/go.mod -m -f '{{.Version}}' github.com/golangci/golangci-lint/v2)" >> "$GITHUB_OUTPUT"
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ steps.tools.outputs.golangci-lint }}
          install-only: true
      - name: Install shellcheck
        env:
          SHELLCHECK_VERSION: v0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          curl -fsSL -o shellcheck.tar.xz "https://github.com/koalaman/shellcheck/releases/download/$SHELLCHECK_VERSION/shellcheck-$SHELLCHECK_VERSION.linux.x86_64.tar.xz"
          echo "$SHELLCHECK_SHA256  shellcheck.tar.xz" | sha256sum -c -
          tar -xJf shellcheck.tar.xz
          sudo install -m 755 "shellcheck-$SHELLCHECK_VERSION/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version
      - name: Run shellcheck and golangci-lint
        run: |
          if make lint GOLANGCI_LINT=golangci-lint > lint.log 2>&1; then
            echo "lint: clean" >> "$GITHUB_STEP_SUMMARY"
          else
            cat lint.log
            { echo "lint: findings"; echo '```'; cat lint.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  release-check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: Read the GoReleaser version from tools/go.mod
        id: tools
        run: echo "goreleaser=$(go list -modfile=tools/go.mod -m -f '{{.Version}}' github.com/goreleaser/goreleaser/v2)" >> "$GITHUB_OUTPUT"
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: ${{ steps.tools.outputs.goreleaser }}
          install-only: true
      - name: Check the GoReleaser config and build every release archive
        run: make release-snapshot GORELEASER=goreleaser

  tool-pins:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the pinned tool downloads against their checksums
        run: scripts/check-tool-downloads.sh | tee -a "$GITHUB_STEP_SUMMARY"
