name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bats python3-yaml parallel
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Run the tests
        id: tests
        run: |
          mkdir -p reports
          set +e
          make test-scripts BATS_FLAGS="--report-formatter junit --output reports"
          scripts=$?
          make test-python PYTEST_FLAGS="--junitxml=reports/pytest.xml"
          python=$?
          echo "status=$((scripts || python))" >> "$GITHUB_OUTPUT"
      - name: Report the Python test coverage
        if: always()
        run: |
          { echo "## Python test coverage"; echo; uv run --frozen coverage report --format=markdown --show-missing; } >> "$GITHUB_STEP_SUMMARY"
      - name: Report the test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0
        with:
          check_name: Test Results
          files: reports/*.xml
          check_run: false
          comment_mode: off
      - name: Fail when a test failed
        if: steps.tests.outputs.status != '0'
        run: exit 1

  python-3-9:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Run the Python tests on Python 3.9, as on Raspberry Pi OS bullseye
        run: make test-python PYTHON=3.9

  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install shellcheck
        env:
          SHELLCHECK_VERSION: v0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          curl -fsSL -o shellcheck.tar.xz "https://github.com/koalaman/shellcheck/releases/download/$SHELLCHECK_VERSION/shellcheck-$SHELLCHECK_VERSION.linux.x86_64.tar.xz"
          echo "$SHELLCHECK_SHA256  shellcheck.tar.xz" | sha256sum -c -
          tar -xJf shellcheck.tar.xz
          sudo install -m 755 "shellcheck-$SHELLCHECK_VERSION/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version
      - name: Run shellcheck
        run: |
          if make lint > shellcheck.log 2>&1; then
            echo "shellcheck: clean" >> "$GITHUB_STEP_SUMMARY"
          else
            cat shellcheck.log
            { echo "shellcheck: findings"; echo '```'; cat shellcheck.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  tool-pins:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the pinned tool downloads against their checksums
        run: scripts/check-tool-downloads.sh | tee -a "$GITHUB_STEP_SUMMARY"
